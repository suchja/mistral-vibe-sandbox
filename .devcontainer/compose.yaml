services:
  vibe:
    # Prebuilt runtime image - see build.sh in the sandbox toolkit repo.
    # NOT a build: line on purpose. If the image is missing, run
    # ./build.sh there first; a clear error beats a stale local build
    # silently diverging from the shared image.
    image: mistral-vibe-sandbox:latest
    # Keep the devcontainer service alive; the image has no daemon.
    command: sleep infinity
    init: true
    environment:
      # All container egress goes through the proxy service; the sandbox
      # network is internal-only, so this is the ONLY way out.
      HTTP_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,proxy
      no_proxy: localhost,127.0.0.1,proxy
    volumes:
      # All vibe-container mounts live here - single source of truth, and the
      # compose file stays valid when run standalone (podman compose up).
      # Sources are relative to this compose file (so they always point at
      # the repo root) or use compose's own env interpolation (${HOME} is
      # read from the host shell that starts compose). Devcontainer-style
      # variables (${localEnv:...}, ${localWorkspaceFolderBasename}, ...) do
      # NOT work in compose files.
      #
      # Workspace bind mount at the FIXED path /workspaces/project: the
      # fixed target is what makes this template project-agnostic - no
      # per-project substitution is needed when copying it into a project.
      - ..:/workspaces/project
      # Read-only shadow mount of the sandbox's own configuration: the
      # agent must never be able to rewrite compose.yaml / devcontainer.json
      # (the files that define this sandbox) and have the change take effect
      # on the next restart/rebuild. Listed after the parent mount so the
      # deeper mount shadows it inside the container. Edit template files on
      # the host, never from inside the sandbox.
      - ../.devcontainer:/workspaces/project/.devcontainer:ro
      # Vibe state/credentials on a per-project named volume. Interpolated
      # from the compose project name, so concurrent project sandboxes do
      # not share one credentials/agent store. (Cost: one vibe login per
      # project. Benefit: safe concurrency and per-project isolation.)
      - vibe-home:/home/vscode/.vibe
      # VS Code remote server on a volume: survives rebuilds instead of
      # reinstalling at every container recreation.
      - vscode-server:/home/vscode/.vscode-server
      # Host git identity, read-only. ${USERPROFILE} is empty on macOS/Linux,
      # ${HOME} is empty on Windows - one of the two always applies.
      - ${HOME}${USERPROFILE}/.vibe-gitconfig:/home/vscode/.gitconfig:ro
    # Sandbox hardening (moved from runArgs, which compose ignores).
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges"
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    networks:
      - sandbox

  proxy:
    # Prebuilt proxy image - squid with the hardened config baked in.
    # Contained: no published ports, reachable only from the sandbox
    # network, config read-only inside the image, and the process drops
    # to an unprivileged user at startup. Capabilities are reduced to
    # the minimum squid needs - see cap_add below.
    image: mistral-vibe-sandbox-proxy:latest
    # Squid starts as root and drops to its internal user; that needs
    # only these capabilities. Everything else - incl. net_raw and
    # sys_chroot from the default set - is dropped.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    restart: unless-stopped
    networks:
      - sandbox
      - egress

networks:
  # Internal-only: containers on this network have no direct route to the
  # host, the LAN, or the internet - only to each other (i.e. the proxy).
  sandbox:
    internal: true
  egress:

volumes:
  # Per-project volume name derived from the compose project name.
  vibe-home:
    name: ${COMPOSE_PROJECT_NAME}-vibe-home
  vscode-server:
    name: ${COMPOSE_PROJECT_NAME}-vscode-server
